<style>
  :root {
    --bg: #ffffff;
    --ink: #2c2f33;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 20px;
    padding: 20px 26px;
  }
  .name {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
  }
  .links {
    display: flex;
    gap: 22px;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 13px;
  }
  .links a {
    color: var(--ink);
    opacity: .62;
    text-decoration: none;
    transition: opacity .15s ease;
  }
  .links a:hover,
  .links a:focus-visible {
    opacity: 1;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    outline: none;
  }

  main {
    display: grid;
    place-items: center;
    min-height: 0;
    padding: 0 20px 60px;
  }
  main img {
    display: block;
    width: min(70vw, 62vh, 560px);
    height: auto;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    position: relative;
    z-index: 1;
  }
  main img.dragging { cursor: grabbing; }
  main img:focus-visible { outline: none; }

  @media (max-width: 480px) {
    header { padding: 16px 18px; }
    .links { gap: 16px; }
  }
</style>

<script>
  const plate = document.getElementById('plate');
  let x = 0, y = 0, start = null;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // kleine rotatie die meegaat met de beweging en rustig terugzakt
  let angle = 0, target = 0, lastX = 0, lastY = 0, lastT = 0;

  function apply() {
    plate.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + angle + 'deg)';
  }

  function wobble() {
    target *= 0.9;                      // zonder beweging terug naar recht
    angle += (target - angle) * 0.18;   // zacht naar de doelhoek
    if (Math.abs(angle) < 0.01 && Math.abs(target) < 0.01) angle = 0;
    apply();
    requestAnimationFrame(wobble);
  }
  if (!reduced) requestAnimationFrame(wobble);

  // houd het bord (grotendeels) binnen het scherm
  function clamp() {
    const r = plate.getBoundingClientRect();
    const baseL = r.left - x, baseT = r.top - y;
    const minX = -baseL - r.width / 2, maxX = window.innerWidth - baseL - r.width / 2;
    const minY = -baseT - r.height / 2, maxY = window.innerHeight - baseT - r.height / 2;
    x = Math.max(minX, Math.min(maxX, x));
    y = Math.max(minY, Math.min(maxY, y));
  }

  plate.addEventListener('pointerdown', e => {
    plate.setPointerCapture(e.pointerId);
    plate.classList.add('dragging');
    start = { px: e.clientX, py: e.clientY, x, y };
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
  });
  plate.addEventListener('pointermove', e => {
    if (!start) return;
    x = start.x + e.clientX - start.px;
    y = start.y + e.clientY - start.py;
    const now = performance.now();
    const dt = Math.max(8, now - lastT);
    const vx = (e.clientX - lastX) / dt;    // px per ms
    target = Math.max(-12, Math.min(12, target + vx * 2.8));
    lastX = e.clientX; lastY = e.clientY; lastT = now;
    clamp(); apply();
  });
  function end() { start = null; plate.classList.remove('dragging'); }
  plate.addEventListener('pointerup', end);
  plate.addEventListener('pointercancel', end);

  plate.addEventListener('keydown', e => {
    const step = e.shiftKey ? 80 : 30;
    const m = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!m) return;
    e.preventDefault();
    x += m[0]; y += m[1];
    target = Math.max(-12, Math.min(12, target + m[0] / 8));
    clamp(); apply();
  });

  window.addEventListener('resize', () => { clamp(); apply(); });
</script>
